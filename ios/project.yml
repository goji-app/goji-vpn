# Описание Xcode-проекта для XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Сам .xcodeproj не хранится в git — генерируется командой `xcodegen generate`.
# Перед генерацией нужно скачать ядро и геоданные: Scripts/bootstrap.sh
name: GojiVPN

options:
  bundleIdPrefix: xyz.gojihub
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: ru
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: NO
    SWIFT_EMIT_LOC_STRINGS: NO
    CLANG_ENABLE_MODULES: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  GojiVPN:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
    dependencies:
      - target: PacketTunnel
        embed: true
        codeSign: true
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_NAME: GojiVPN
        PRODUCT_BUNDLE_IDENTIFIER: $(GOJI_APP_BUNDLE_ID)
        INFOPLIST_FILE: Config/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/GojiVPN.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_ACTIVE_COMPILATION_CONDITIONS[config=Debug]: DEBUG
        ENABLE_PREVIEWS: YES

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    dependencies:
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_NAME: PacketTunnel
        PRODUCT_BUNDLE_IDENTIFIER: $(GOJI_TUNNEL_BUNDLE_ID)
        INFOPLIST_FILE: Config/Tunnel-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/PacketTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  GojiVPNTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: GojiVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.gojihub.vpn.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GojiVPN.app/GojiVPN
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  GojiVPN:
    build:
      targets:
        GojiVPN: all
        PacketTunnel: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - GojiVPNTests
    archive:
      config: Release
