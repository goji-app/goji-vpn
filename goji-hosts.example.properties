# Адреса, которые приложения получают при сборке. Настоящие значения лежат в
# goji-hosts.properties рядом с этим файлом (он в .gitignore) или в переменных окружения
# с теми же именами (так их получает CI — из секретов репозитория). Без них сборка
# останавливается с понятной ошибкой.
#
# GOJI_SITE_URL      — кабинет: вход, подписка, тарифы, поддержка (без «/» в конце)
# GOJI_DOWNLOAD_URL  — сайт загрузки: latest.json, сборки, геоданные (без «/» в конце)
GOJI_SITE_URL=https://example.com
GOJI_DOWNLOAD_URL=https://get.example.com
