# GodjiVpn.csproj таргетит net8.0-windows10.0.19041.0 с UseWPF=true — чисто Windows-технология,
# на ubuntu-latest (дефолтный шаблон GitHub при создании репозитория) собраться в принципе не
# может ("set the EnableWindowsTargeting property to true" — это про cross-target reference
# assemblies, не про реальный запуск, WPF на Linux не запустится в любом случае). Тестового
# проекта в решении нет — шаг Test убран, а не оставлен как no-op.

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore -c Release
